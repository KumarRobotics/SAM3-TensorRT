# Save as .github/workflows/tests.yml
name: Unit Tests

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: unit-tests-${{ github.ref }}
  cancel-in-progress: true

env:
  # Tag produced by docker/build-trt.bash
  IMAGE: sam3-tensorrt:infer

jobs:
  # This job name is what you select in the branch protection rule.
  unit-tests:
    runs-on: [self-hosted, linux, gpu]   # must match --labels used in config.sh
    timeout-minutes: 90

    # Don't run fork PRs on your own hardware.
    if: >-
      github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.full_name == github.repository

    steps:
      - uses: actions/checkout@v4
        with:
          # Keep sam3trt/build between runs for incremental C++ builds.
          clean: false

      # Same script you use by hand. It must run from inside docker/ (it uses
      # `-f Dockerfile.trt .`). Layers are cached, so only the first run is slow.
      - name: Build docker image
        working-directory: docker
        run: ./build-trt.bash

      - name: Run unit tests in container
        env:
          # Engines live on the runner machine (they are not in git).
          # Must contain image_encoder_fp16.engine, text_encoder_fp16.engine,
          # mask_decoder_fp16.engine.
          MODELS_DIR: /home/jason/models
          TEST_SCRIPT: |
            set -uo pipefail
            rc=0

            if ! ls "$HOME"/models/*.engine >/dev/null 2>&1; then
              echo "::error::No .engine files found in the mounted models dir"
              exit 1
            fi
            nvidia-smi || true

            echo "::group::C++ build and tests"
            ( cd "$HOME/sam3trt" \
              && cmake -S . -B build -DSAM3TRT_BUILD_TESTS=ON -DSAM3TRT_BUILD_ROS=OFF \
              && cmake --build build -j"$(nproc)" \
              && ctest --test-dir build --output-on-failure -E Timing ) || rc=1
            echo "::endgroup::"

            echo "::group::Python tests"
            ( cd "$HOME" \
              && pip install --user --break-system-packages --no-cache-dir ./sam3trtpy \
              && cd sam3trtpy \
              && python3 -m unittest discover -s tests -v ) || rc=1
            echo "::endgroup::"

            exit $rc
        run: |
          U="$(whoami)"
          # Same mounts as docker/run-trt.bash, minus the interactive/X11 parts.
          docker run --rm \
            --gpus all \
            --ipc=host \
            --user "$(id -u):$(id -g)" \
            -e HOME="/home/$U" \
            -e TEST_SCRIPT \
            -v "$MODELS_DIR:/home/$U/models" \
            -v "$GITHUB_WORKSPACE/sam3trt:/home/$U/sam3trt" \
            -v "$GITHUB_WORKSPACE/sam3trtpy:/home/$U/sam3trtpy" \
            -w "/home/$U" \
            "$IMAGE" \
            bash -c "$TEST_SCRIPT"
